# ============================================================
# case2auto 配置：测试用例 -> 自动化脚本 生成器
# 接入任意 OpenAI 兼容模型（智谱 / 通义 / DeepSeek / GPT）
# ============================================================

llm:
  # 智谱GLM；换通义/DeepSeek/GPT 只改 base_url 与 model
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  api_key: "${LLM_API_KEY}"          # 从环境变量读，禁止硬编码明文
  model: "glm-4-plus"
  temperature: 0.2                    # 生成代码要低温度，减少乱发挥
  timeout: 120

run:
  human_gate: true                    # 每段跑完暂停，人工确认后再进下一段
  resume: true                        # 已存在的中间产物跳过（断点续跑）
  output_dir: "output"                # 中间产物 stage_a/b/c.md + review.md
  project_dir: "output/generated_project"   # 最终落盘的 pytest 工程

# ---------- 目录路径（pipeline.py 读取） ----------
paths:
  prompts: "prompts"                  # 四段提示词目录
  inputs: "inputs/cases.csv"          # 手工用例台账
  output: "output/generated_project"  # 生成脚本落盘目录（与 run.project_dir 保持一致）

selenium:
  wait_timeout: 10                    # WebDriverWait 默认超时（秒）
  forbid_time_sleep: true             # 注入到 Stage C 的硬约束开关

# ---------- 报告邮件：跑一次发一次，成败都发 ----------
mail:
  enabled: true
  smtp:
    host: "smtp.qq.com"              # QQ: smtp.qq.com:465 / 163: smtp.163.com:465 / Gmail: smtp.gmail.com:587
    port: 465
    user: "395725813@qq.com"
    password: "${SMTP_AUTH_CODE}"    # 授权码，不是登录密码！见 README 第六节
    ssl: true                        # 465 用 SSL；587 用 STARTTLS
  # 收件人路由：每次都发 always；失败额外加发。若不想分级，只保留 always 即可
  recipients:
    always: ["395725813@qq.com"]             # 每次必发
  attach_report: false               # 是否把 allure-report 打包成 zip 附件
  pages_url: "https://Emily8801.github.io/my-automation-project/"   # Allure 在线报告链接
