# ============================================================
# config.yaml —— case2auto 用例生成器配置（预留）
#
# ⚠️ 分工约定（键不重叠，避免多处配置互相打架）：
#   - 本文件：只放生成器专属配置（模型、收件人路由）
#   - config/settings.py：自动化框架配置（浏览器、URL、超时）
#   - .env：所有敏感凭据（统一入口，不进 git）
# 注意：当前没有任何代码读取本文件，属于结构占位，
#       等 case2auto 功能落地时由 src/ 下的代码消费。
# ============================================================

llm:
  model: gpt-4o                 # 用例生成所用的大模型
  api_key_env: LLM_API_KEY      # key 本体放 .env，这里只记录环境变量名
  temperature: 0.2              # 生成温度，越低输出越稳定

run:
  human_gate: true              # 每段生成后暂停，人工确认再进下一段
  output_dir: output/generated_project  # 生成脚本的落盘目录

mail:
  recipients:
    always:                     # 每次跑完必发的收件人
      - 395725813@qq.com
    on_failure: []              # 仅失败时加发的收件人（不需要就留空）
