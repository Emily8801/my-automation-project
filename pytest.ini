[pytest]
# 指定测试用例搜索目录
testpaths = testcase tests

# 指定测试文件名称匹配规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 开启控制台日志输出
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s | %(levelname)-7s | %(message)s
log_cli_date_format = %H:%M:%S

# 记录日志到文件
log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s

# 默认命令行参数
# -v: 显示详细信息
# --tb=short: 报错时显示简短 traceback
addopts = -v --tb=short

# 自定义标记 (避免 UnknownMarkWarning)
markers =
    smoke: 冒烟测试
    regression: 回归测试

# 邮件服务器配置
email_smtp_server = smtp.qq.com
email.smtp_port = 465
email_smtp_ssl = true
email_sender = 395728813@qq.com
email_password = ${SMTP_PASSWORD}   #⚠️ 注意：这里填的是【授权码】，不是登录密码！
email_receiver = receiver@example.com, boss@example.com  # 多个收件人用逗号分隔
email_subject = 【自动化测试报告】{date} {pass_rate}