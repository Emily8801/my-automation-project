# GitHub Actions 工作流：推送代码后自动运行接口测试
# 说明：Selenium UI 用例依赖内网 UAT 环境，云端 runner 访问不到，
#       所以 CI 里只跑不依赖内网的接口用例（test_practice.py）
name: API Tests

# ========== 触发时机 ==========
on:
  push:
    branches: [main]        # 推送到 main 分支时触发
  workflow_dispatch:        # 允许在 GitHub 网页上手动点击触发
  schedule:
    - cron: "0 1 * * *"     # 每天定时跑（cron 是 UTC 时间，0 1 * * * = 北京时间 09:00）
                            # 其他例子：0 10 * * 1-5 = 周一~周五北京时间 18:00；0 */4 * * * = 每 4 小时

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 部署 Allure 报告到 gh-pages 分支需要写权限

    steps:
      # 1. 拉取仓库代码
      - uses: actions/checkout@v4

      # 2. 安装 Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # 3. 安装依赖（pytest-rerunfailures/allure-pytest 是 addopts 必需的；conftest.py 依赖 python-dotenv）
      - name: Install dependencies
        run: pip install requests pytest pytest-rerunfailures allure-pytest python-dotenv

      # 4. 运行接口测试用例（pytest.ini 自动带 --alluredir=reports/allure-results）
      - name: Run API tests
        run: pytest testcase/test_practice.py -v

      # 5. 安装 Allure 命令行（ubuntu runner 自带 Java）
      - name: Install Allure commandline
        if: always()
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          sudo tar -zxf allure-2.29.0.tgz -C /opt/
          sudo ln -sf /opt/allure-2.29.0/bin/allure /usr/bin/allure

      # 6. 生成 Allure HTML 报告（无论用例成败都生成）
      - name: Generate Allure report
        if: always()
        run: allure generate reports/allure-results -o reports/allure-report --clean

      # 7. 部署到 gh-pages 分支（需先在仓库 Settings → Pages → Source 选 gh-pages 分支）
      - name: Deploy Allure report to Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/allure-report

